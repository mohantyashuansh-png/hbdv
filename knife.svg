<svg width="250" height="250" viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Blade metal gradient -->
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b0b0b0"/>
      <stop offset="25%" stop-color="#eeeeee"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#cccccc"/>
      <stop offset="100%" stop-color="#8a8a8a"/>
    </linearGradient>
    
    <!-- Shadow for depth -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#drop-shadow)">
    <!-- Blade -->
    <path d="M 45 15 Q 55 10 55 45 L 55 90 L 45 90 Z" fill="url(#silver)" />
    
    <!-- Handle Base -->
    <rect x="42" y="90" width="16" height="50" rx="3" fill="#1a1a1a" />
    <path d="M 42 90 L 58 90 L 60 95 L 40 95 Z" fill="#4d4d4d" />
    
    <!-- Handle Rivets -->
    <circle cx="50" cy="100" r="1.5" fill="#555" />
    <circle cx="50" cy="115" r="1.5" fill="#555" />
    <circle cx="50" cy="130" r="1.5" fill="#555" />
    
    <!-- Hand (fingers wrapping over handle) -->
    <!-- Index -->
    <rect x="35" y="95" width="30" height="13" rx="6.5" fill="#f1c27d" />
    <path d="M 35 101.5 Q 35 95 41.5 95 L 60 95 L 60 108 L 41.5 108 Q 35 108 35 101.5 Z" fill="#e5b36b" opacity="0.3"/>
    
    <!-- Middle -->
    <rect x="35" y="108" width="28" height="13" rx="6.5" fill="#f1c27d" />
    <path d="M 35 114.5 Q 35 108 41.5 108 L 58 108 L 58 121 L 41.5 121 Q 35 121 35 114.5 Z" fill="#e5b36b" opacity="0.3"/>
    
    <!-- Ring -->
    <rect x="35" y="121" width="26" height="13" rx="6.5" fill="#f1c27d" />
    <path d="M 35 127.5 Q 35 121 41.5 121 L 56 121 L 56 134 L 41.5 134 Q 35 134 35 127.5 Z" fill="#e5b36b" opacity="0.3"/>
    
    <!-- Pinky -->
    <rect x="38" y="134" width="22" height="11" rx="5.5" fill="#f1c27d" />
    
    <!-- Thumb stretching out -->
    <path d="M 37 98 Q 23 98 23 115 Q 23 125 35 120 Z" fill="#d9a86c" />
    <path d="M 36 98 Q 22 98 22 115 Q 22 125 34 120 Z" fill="#f1c27d" />
    
    <!-- Finger Knuckle Highlights -->
    <ellipse cx="61" cy="101.5" rx="2" ry="4" fill="#ffdfa6" opacity="0.6"/>
    <ellipse cx="59" cy="114.5" rx="2" ry="4" fill="#ffdfa6" opacity="0.6"/>
    <ellipse cx="57" cy="127.5" rx="2" ry="4" fill="#ffdfa6" opacity="0.6"/>
  </g>
</svg>
